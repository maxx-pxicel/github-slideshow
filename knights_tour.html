<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Knight's Tour Interactive</title>
<style>
  body {
    margin: 0;
    background-color: #0f172a;
    color: #fff;
    font-family: sans-serif;
    text-align: center;
    overflow: hidden;
  }
  h2 { margin: 10px 0; }
  #toolbar {
    position: fixed;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 100;
  }
  button {
    background-color: #3b82f6;
    border: none;
    color: white;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  #board-container {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  canvas {
    background-color: #0f172a;
    border: 2px solid #334155;
  }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="nextBtn">Next Step</button>
    <button id="undoBtn">Undo Step</button>
    <button id="resetBtn">Reset</button>
    <button id="fitBtn">Fit to View</button>
  </div>
  <div id="board-container">
    <canvas id="board" width="800" height="800"></canvas>
  </div>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const size = 200; // board size

// Default zoom/pan state
const defaultScale = 1;
const defaultOffsetX = 0;
const defaultOffsetY = 0;
const minScale = 0.1;
const maxScale = 10;

let scale = defaultScale, offsetX = defaultOffsetX, offsetY = defaultOffsetY;
let dragging = false, lastX, lastY;

const cellSize = 20;
let startX = null, startY = null;
let knightTour = [];

const moves = [
  [2, 1], [1, 2], [-1, 2], [-2, 1],
  [-2, -1], [-1, -2], [1, -2], [2, -1]
];

function drawBoard() {
  ctx.save();
  ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
  ctx.clearRect(-offsetX/scale, -offsetY/scale, canvas.width/scale, canvas.height/scale);

  for (let i = 0; i < size; i++) {
    for (let j = 0; j < size; j++) {
      ctx.strokeStyle = "#334155";
      ctx.strokeRect(i * cellSize, j * cellSize, cellSize, cellSize);
    }
  }

  // Draw path
  ctx.strokeStyle = "lime";
  ctx.lineWidth = 2;
  for (let i = 1; i < knightTour.length; i++) {
    const [x1, y1] = knightTour[i - 1];
    const [x2, y2] = knightTour[i];
    ctx.beginPath();
    ctx.moveTo(x1 * cellSize + cellSize / 2, y1 * cellSize + cellSize / 2);
    ctx.lineTo(x2 * cellSize + cellSize / 2, y2 * cellSize + cellSize / 2);
    ctx.stroke();
  }

  // Draw numbers
  ctx.fillStyle = "yellow";
  ctx.font = `${Math.max(10, cellSize / 1.5)}px Arial`;
  knightTour.forEach(([x, y], i) => {
    ctx.fillText(i + 1, x * cellSize + cellSize / 3, y * cellSize + cellSize / 1.5);
  });

  // Draw start point
  if (startX !== null && startY !== null) {
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(startX * cellSize + cellSize / 2, startY * cellSize + cellSize / 2, cellSize / 3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// Click to select start or move
canvas.addEventListener("click", (e) => {
  // Prevent click during drag
  if (e.defaultPrevented) return;
  
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left - offsetX) / scale;
  const y = (e.clientY - rect.top - offsetY) / scale;
  const i = Math.floor(x / cellSize);
  const j = Math.floor(y / cellSize);

  // Ensure click is within board bounds
  if (i < 0 || j < 0 || i >= size || j >= size) return;

  if (startX === null) {
    startX = i; startY = j;
    knightTour = [[i, j]];
  } else {
    // Check if it's a valid knight move
    const [lastX, lastY] = knightTour[knightTour.length - 1];
    const dx = Math.abs(i - lastX);
    const dy = Math.abs(j - lastY);
    if ((dx === 2 && dy === 1) || (dx === 1 && dy === 2)) {
      knightTour.push([i, j]);
    }
  }
  drawBoard();
});

// Next step button – auto find next move by Warnsdorff
document.getElementById("nextBtn").onclick = () => {
  if (startX === null) return;
  const [cx, cy] = knightTour[knightTour.length - 1];
  const next = getNextMove(cx, cy);
  if (next) {
    knightTour.push(next);
    drawBoard();
  }
};

// Undo step
document.getElementById("undoBtn").onclick = () => {
  if (knightTour.length > 1) knightTour.pop();
  drawBoard();
};

// Enhanced Reset - resets both tour and zoom/pan
document.getElementById("resetBtn").onclick = () => {
  startX = startY = null;
  knightTour = [];
  
  // Reset zoom and pan to default
  scale = defaultScale;
  offsetX = defaultOffsetX;
  offsetY = defaultOffsetY;
  
  drawBoard();
};

// Fit to View - centers and scales the board to fit the canvas
document.getElementById("fitBtn").onclick = () => {
  const boardWidth = size * cellSize;
  const boardHeight = size * cellSize;
  
  // Calculate scale to fit the board in the canvas with some padding
  const padding = 50;
  const scaleX = (canvas.width - padding * 2) / boardWidth;
  const scaleY = (canvas.height - padding * 2) / boardHeight;
  scale = Math.min(scaleX, scaleY, maxScale);
  scale = Math.max(scale, minScale);
  
  // Center the board
  offsetX = (canvas.width - boardWidth * scale) / 2;
  offsetY = (canvas.height - boardHeight * scale) / 2;
  
  drawBoard();
};

// Warnsdorff heuristic
function getNextMove(x, y) {
  const options = [];
  for (const [dx, dy] of moves) {
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < size && ny < size && !isVisited(nx, ny)) {
      const degree = countMoves(nx, ny);
      options.push({ nx, ny, degree });
    }
  }
  if (!options.length) return null;
  options.sort((a, b) => a.degree - b.degree);
  return [options[0].nx, options[0].ny];
}

function isVisited(x, y) {
  return knightTour.some(([a, b]) => a === x && b === y);
}

function countMoves(x, y) {
  return moves.filter(([dx, dy]) => {
    const nx = x + dx, ny = y + dy;
    return nx >= 0 && ny >= 0 && nx < size && ny < size && !isVisited(nx, ny);
  }).length;
}

// --- Enhanced Zoom and Pan ---
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  
  // Get mouse position for zoom center
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  
  // Calculate zoom
  const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
  const newScale = Math.min(maxScale, Math.max(minScale, scale * zoomFactor));
  
  // Calculate new offset to zoom towards mouse position
  const scaleChange = newScale / scale;
  offsetX = mouseX - (mouseX - offsetX) * scaleChange;
  offsetY = mouseY - (mouseY - offsetY) * scaleChange;
  
  scale = newScale;
  drawBoard();
});

canvas.addEventListener("pointerdown", (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  e.preventDefault(); // Prevent default touch behavior
});

canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  e.preventDefault(); // Prevent scrolling while dragging
  
  const deltaX = e.clientX - lastX;
  const deltaY = e.clientY - lastY;
  
  offsetX += deltaX;
  offsetY += deltaY;
  lastX = e.clientX;
  lastY = e.clientY;
  drawBoard();
});

canvas.addEventListener("pointerup", (e) => {
  dragging = false;
  e.preventDefault();
});

canvas.addEventListener("pointerleave", () => {
  dragging = false;
});

// Enhanced Touch pinch zoom
let lastDist = 0;
let initialScale = 1;

canvas.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastDist = Math.sqrt(dx * dx + dy * dy);
    initialScale = scale;
  }
});

canvas.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (lastDist > 0) {
      const scaleFactor = dist / lastDist;
      const newScale = Math.min(maxScale, Math.max(minScale, initialScale * scaleFactor));
      
      // Get center point of pinch for zoom center
      const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const rect = canvas.getBoundingClientRect();
      const canvasX = centerX - rect.left;
      const canvasY = centerY - rect.top;
      
      // Calculate new offset to zoom towards pinch center
      const scaleChange = newScale / scale;
      offsetX = canvasX - (canvasX - offsetX) * scaleChange;
      offsetY = canvasY - (canvasY - offsetY) * scaleChange;
      
      scale = newScale;
      drawBoard();
    }
  }
});

canvas.addEventListener("touchend", (e) => {
  if (e.touches.length < 2) {
    lastDist = 0;
    initialScale = scale;
  }
});

drawBoard();
</script>
</body>
</html>
